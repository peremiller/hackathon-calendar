<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HackCal · Tech Hackathon Calendar</title>
<meta name="theme-color" content="#07111f">
<meta name="description" content="Discover, filter, organize, and export real tech hackathons with HackCal.">
<link rel="icon" type="image/png" href="assets/hackcal-logo.png">
<link rel="apple-touch-icon" href="assets/hackcal-logo.png">
<link rel="stylesheet" href="assets/phosphor/style.css">
<style>
  :root{
    color-scheme:dark;
    --bg:#07111f; --panel:#0b1726; --panel2:#102033; --panel3:#14253a; --line:#22344a;
    --txt:#f4f7fb; --muted:#99a8bb; --subtle:#6f8095; --accent:#5865f2; --accent-strong:#4151dc;
    --accent-soft:#202a64; --cyan:#58d5df; --good:#91dc23; --warn:#ffad19; --bad:#f26b75;
    --violet:#9a67f6; --chip:#101d2e; --header:#081321; --shadow:0 18px 50px rgba(0,0,0,.28);
    --event-online:#58d5df; --event-person:#397df5; --event-hybrid:#9a67f6;
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --bg:#f4f7fb; --panel:#ffffff; --panel2:#eef3f8; --panel3:#e6edf5; --line:#d6e0eb;
    --txt:#132033; --muted:#596a80; --subtle:#7c8ca0; --accent:#4e5de4; --accent-strong:#3c49c7;
    --accent-soft:#e8ebff; --cyan:#068e9c; --good:#4b8700; --warn:#b76600; --bad:#bf4051;
    --violet:#7544d8; --chip:#f1f5f9; --header:#ffffff; --shadow:0 18px 45px rgba(31,53,79,.12);
    --event-online:#0f99a6; --event-person:#2868d7; --event-hybrid:#7649cf;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt);line-height:1.45;transition:background .2s,color .2s;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit}
  button{color:inherit}
  .topbar{position:sticky;top:0;z-index:30;height:70px;background:color-mix(in srgb,var(--header) 94%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}
  .bar{height:100%;display:flex;align-items:center;gap:16px;padding:0 20px}
  .brand{display:flex;align-items:center;gap:10px;min-width:230px;font-size:22px;font-weight:750;letter-spacing:-.35px}
  .logo{width:38px;height:38px;border-radius:9px;object-fit:cover;border:1px solid var(--line)}
  .brand small{display:none}
  .spacer{flex:1}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
  .seg button,.btn,.icon-btn,.nav{border:0;background:transparent;cursor:pointer;transition:background .15s,border-color .15s,color .15s,transform .15s}
  .seg button{display:flex;align-items:center;gap:7px;padding:9px 14px;color:var(--muted);font-size:13px;font-weight:650}
  .seg button.on{background:var(--accent-strong);color:white}
  .top-actions{display:flex;align-items:center;gap:3px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 12px;border:1px solid transparent;border-radius:8px;color:var(--txt);font-size:13px;font-weight:620;white-space:nowrap}
  .btn:hover,.icon-btn:hover,.nav:hover{background:var(--panel2);border-color:var(--line)}
  .btn:focus-visible,.icon-btn:focus-visible,.nav:focus-visible,.seg button:focus-visible,.filter-row:focus-visible,.event-bar:focus-visible,.agenda-row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:white;padding-inline:16px}
  .btn.primary:hover{background:var(--accent-strong);transform:translateY(-1px)}
  .btn.secondary{border-color:var(--line);background:var(--panel)}
  .icon-btn,.nav{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:18px}
  .theme-toggle{border-radius:999px;width:58px;display:flex;gap:2px;padding:3px}
  .theme-toggle i{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;font-size:15px}
  :root:not([data-theme="light"]) .theme-toggle .ph-moon{background:var(--panel3);color:white}
  :root[data-theme="light"] .theme-toggle .ph-sun{background:var(--accent-soft);color:var(--accent)}
  .menu-wrap{position:relative}
  .tools-menu{position:absolute;right:0;top:calc(100% + 8px);width:210px;padding:7px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);display:none}
  .tools-menu.show{display:block}
  .tools-menu button{width:100%;display:flex;align-items:center;gap:9px;padding:9px 10px;border:0;border-radius:7px;background:transparent;color:var(--txt);text-align:left;cursor:pointer}
  .tools-menu button:hover{background:var(--panel2)}

  .app-layout{display:grid;grid-template-columns:268px minmax(660px,1fr) 310px;min-height:calc(100vh - 70px)}
  .details-hidden .app-layout{grid-template-columns:268px minmax(660px,1fr)}
  .details-hidden .right-rail{display:none}
  .left-rail,.right-rail{background:color-mix(in srgb,var(--panel) 55%,var(--bg));position:sticky;top:70px;height:calc(100vh - 70px);overflow:auto}
  .left-rail{border-right:1px solid var(--line);padding:22px 16px}
  .right-rail{border-left:1px solid var(--line);padding:24px 22px}
  .workspace{min-width:0;padding:20px 20px 30px}
  .search-box{position:relative;margin-bottom:24px}
  .search-box i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
  input,select,textarea{background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:9px 11px;border-radius:8px;font-size:13px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
  .search{width:100%;padding-left:35px}
  .section-heading{display:flex;align-items:center;justify-content:space-between;margin:0 5px 9px;color:var(--muted);font-size:11px;font-weight:720;letter-spacing:.55px;text-transform:uppercase}
  .text-button{border:0;background:transparent;color:var(--muted);font-size:11px;cursor:pointer;padding:2px 0}
  .text-button:hover{color:var(--txt)}
  .filter-section{padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--line)}
  .filter-row{width:100%;min-height:37px;display:flex;align-items:center;gap:9px;padding:7px 5px;border:0;border-radius:7px;background:transparent;color:var(--txt);cursor:pointer;text-align:left;font-size:13px}
  .filter-row:hover{background:var(--panel2)}
  .filter-row .filter-label{flex:1}
  .filter-count{color:var(--muted);font-variant-numeric:tabular-nums}
  .checkmark{width:16px;height:16px;display:grid;place-items:center;border:1px solid var(--subtle);border-radius:4px;color:transparent;font-size:12px}
  .filter-row.on .checkmark{background:var(--accent);border-color:var(--accent);color:white}
  .filter-row.good.on .checkmark{background:var(--good);border-color:var(--good);color:#122000}
  .format-select{width:100%;margin-bottom:4px}
  .rail-footer{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;padding:4px 5px}

  .stats{display:flex;align-items:stretch;gap:0;margin:0 0 18px;color:var(--muted);font-size:12px;overflow:auto}
  .stat{min-width:108px;padding:0 18px;border-right:1px solid var(--line)}
  .stat:first-child{padding-left:0}.stat:last-child{border-right:0}
  .stat b{display:flex;align-items:center;gap:8px;color:var(--txt);font-size:19px;line-height:1.1;margin-bottom:3px;font-variant-numeric:tabular-nums}
  .status-dot{width:10px;height:10px;border-radius:50%;background:var(--subtle);display:inline-block;flex:0 0 auto}
  .status-dot.good{background:var(--good)}.status-dot.violet{background:var(--violet)}.status-dot.cyan{background:var(--cyan)}.status-dot.warn{background:var(--warn)}.status-dot.bad{background:var(--bad)}.status-dot.person{background:var(--event-person)}
  .cal-head{display:flex;align-items:center;gap:8px;margin-bottom:15px}
  .cal-head h2{margin:0 8px;font-size:22px;letter-spacing:-.4px;min-width:170px}
  .cal-head .today{margin-left:auto}
  .grid{display:grid;grid-template-columns:repeat(7,minmax(92px,1fr))}
  .dow{padding:0 10px 10px;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.45px}
  .calendar-grid{grid-auto-rows:105px;border-top:1px solid var(--line);border-left:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
  .cell{min-width:0;padding:9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel);position:relative}
  .cell.out{background:color-mix(in srgb,var(--panel) 70%,var(--bg));color:var(--subtle)}
  .daynum{font-size:13px;font-weight:650;color:var(--txt)}
  .cell.out .daynum{color:var(--subtle)}
  .cell.today .daynum span{width:25px;height:25px;display:grid;place-items:center;border-radius:50%;background:var(--accent);color:white;margin:-4px}
  .event-bar{z-index:3;align-self:start;min-width:0;height:30px;margin:36px 7px 0;padding:5px 9px;border:1px solid color-mix(in srgb,var(--event-color) 75%,var(--line));border-radius:6px;background:color-mix(in srgb,var(--event-color) 16%,var(--panel));color:var(--txt);font-size:11.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;text-align:left}
  .event-bar[data-lane="1"]{margin-top:67px}.event-bar[data-lane="2"]{margin-top:76px;height:22px;padding-block:2px}
  .event-bar:hover,.event-bar.selected{background:color-mix(in srgb,var(--event-color) 25%,var(--panel));box-shadow:inset 0 0 0 1px var(--event-color)}
  .event-bar .event-dates{color:var(--muted);font-weight:500;margin-left:8px}
  .agenda{margin-top:16px;border-top:1px solid var(--line)}
  .agenda-head{display:flex;align-items:center;justify-content:space-between;padding:15px 2px 9px;font-size:13px}
  .agenda-head a{color:var(--accent);text-decoration:none;font-size:12px}
  .agenda-row{display:grid;grid-template-columns:minmax(180px,1.5fr) 100px 140px minmax(140px,1fr) 110px;align-items:center;gap:12px;min-height:46px;padding:8px;border-top:1px solid var(--line);cursor:pointer;font-size:12px}
  .agenda-row:hover,.agenda-row.selected{background:var(--panel2)}
  .agenda-name{display:flex;align-items:center;gap:9px;min-width:0;font-size:13px;font-weight:650}.agenda-name span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .agenda-muted{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .venue-link{color:inherit;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 55%,transparent);text-underline-offset:2px}
  .venue-link:hover,.venue-link:focus-visible{color:var(--accent);text-decoration-color:currentColor}
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:3px 7px;border-radius:5px;background:var(--chip);color:var(--muted);font-weight:600;border:1px solid var(--line);white-space:nowrap}
  .reg{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;padding:4px 8px;border-radius:5px;font-weight:700;border:1px solid transparent;white-space:nowrap}
  .reg.open{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,var(--line));background:color-mix(in srgb,var(--good) 10%,var(--panel))}.reg.soon{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 10%,var(--panel))}.reg.closed{color:var(--muted);border-color:var(--line);background:var(--chip)}.reg.preopen{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 45%,var(--line));background:color-mix(in srgb,var(--cyan) 10%,var(--panel))}
  .list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .card{background:var(--panel);border-bottom:1px solid var(--line);padding:15px;display:flex;gap:15px;align-items:flex-start;cursor:pointer;transition:background .15s}
  .card:last-child{border-bottom:0}.card:hover,.card.selected{background:var(--panel2)}
  .date-badge{flex-shrink:0;width:58px;text-align:center;background:var(--panel2);border-radius:8px;padding:7px 0;border:1px solid var(--line)}
  .date-badge .m{font-size:10px;color:var(--accent);font-weight:800;text-transform:uppercase}.date-badge .d{font-size:23px;font-weight:800;line-height:1.05}.date-badge .y{font-size:9px;color:var(--muted)}
  .card h3{margin:0 0 4px;font-size:15px}.card p{margin:6px 0 0;color:var(--muted);font-size:12.5px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.countdown{margin-left:auto;text-align:right;font-size:11px;color:var(--muted)}.countdown b{display:block;font-size:17px;color:var(--accent)}
  .empty{text-align:center;color:var(--muted);padding:60px 20px}

  .rail-close{float:right;margin:-8px -8px 8px 8px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:20px}
  .eyebrow{display:flex;align-items:center;gap:8px;color:var(--good);font-size:12px;font-weight:700;margin-bottom:13px}
  .right-rail h2{font-size:20px;margin:0 0 13px;letter-spacing:-.25px}.right-rail h3{font-size:13px;margin:22px 0 10px}
  .detail-line{display:flex;align-items:flex-start;gap:9px;color:var(--muted);font-size:12.5px;margin:9px 0}.detail-line i{font-size:16px;margin-top:1px}
  .detail-copy{font-size:13px;line-height:1.55;margin:18px 0;color:var(--txt)}
  .detail-tags{display:flex;gap:6px;flex-wrap:wrap}.rail-divider{height:1px;background:var(--line);margin:20px 0}
  .next-card{display:grid;grid-template-columns:46px 1fr;gap:10px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
  .next-date{text-align:center;color:var(--muted);font-size:10px}.next-date b{display:block;color:var(--txt);font-size:20px}.next-title{display:block;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.next-meta{display:block;color:var(--muted);font-size:11px;margin-top:5px}
  .upcoming-item{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;font-size:11.5px}.upcoming-item span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.upcoming-item time{color:var(--muted)}
  .legend{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:10.5px}
  footer{text-align:center;color:var(--muted);font-size:11px;padding:24px}

  .modal-bg{position:fixed;inset:0;background:rgba(3,9,16,.72);backdrop-filter:blur(5px);display:none;place-items:center;z-index:50;padding:20px}.modal-bg.show{display:grid}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;width:min(590px,100%);max-height:88vh;overflow:auto;box-shadow:var(--shadow)}.modal h2{margin:0 0 5px}.modal .close{float:right;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:19px;background:transparent;border:0;border-radius:7px}.modal .close:hover{background:var(--panel2);color:var(--txt)}
  .field{margin-top:14px;display:flex;flex-direction:column;gap:6px}.field label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}.field input,.field select,.field textarea{width:100%}.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-actions{display:flex;gap:9px;margin-top:22px;justify-content:flex-end}.det-row{display:flex;gap:10px;margin-top:11px;font-size:13px}.det-row .k{color:var(--muted);width:104px;flex-shrink:0;font-weight:600}a.link{color:var(--cyan);text-decoration:none}a.link:hover{text-decoration:underline}

  .fieldlabel{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.45px;margin-bottom:6px}
  .live-row{display:flex;align-items:flex-start;gap:10px;padding:11px 2px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13px;line-height:1.4}
  .live-row .ic{width:24px;height:24px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:var(--panel2);color:var(--accent);font-size:15px;line-height:1}
  .live-row .nm{flex:1;min-width:0}.live-row .st{flex:0 0 auto;font-size:11px;white-space:nowrap;text-align:right}
  .live-row .note{color:var(--muted);font-size:11.5px;line-height:1.45;margin-top:3px}.live-row input{margin-top:5px;accent-color:var(--accent)}
  .stat.action{border:0;border-right:1px solid var(--line);background:transparent;color:var(--muted);text-align:left;cursor:pointer;font:inherit}
  .stat.action:hover b,.stat.action:focus-visible b{color:var(--accent)}
  .stat.action:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}
  @media(max-width:1240px){.app-layout{grid-template-columns:240px minmax(620px,1fr)}.right-rail{display:none}.brand{min-width:210px}.top-action.utility{display:none}.agenda-row{grid-template-columns:minmax(180px,1.4fr) 95px 130px minmax(120px,1fr) 105px}}
  @media(max-width:900px){.topbar{height:auto;min-height:64px}.bar{min-height:64px;flex-wrap:wrap;padding:10px 14px}.brand{min-width:auto}.app-layout{display:block}.left-rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px}.search-box{margin-bottom:12px}.filter-section{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:5px;padding:0;margin:0;border:0;overflow:auto}.filter-section .section-heading,.tech-section{display:none}.workspace{padding:16px}.stats{margin-top:2px}}
  @media(max-width:720px){.brand-name{display:none}.logo{width:34px;height:34px}.bar{gap:8px}.seg button{padding:8px 10px}.top-actions .btn-label,.more-label{display:none}.top-actions .btn,.menu-wrap>.btn{width:38px;padding:8px}.btn.primary{width:40px;padding:8px}.workspace{padding:13px 10px}.cal-head h2{font-size:18px;min-width:138px}.calendar-wrap{overflow-x:auto;padding-bottom:5px}.calendar-inner{min-width:720px}.agenda-row{grid-template-columns:minmax(180px,1fr) 90px 130px}.agenda-row>*:nth-child(4),.agenda-row>*:nth-child(5){display:none}.row2{grid-template-columns:1fr}.card p{display:none}.countdown{display:none}}

  /* v4 merged direction: premium navigation, daily briefing, and calendar workspace */
  body{background:var(--panel);overflow-x:hidden}
  .app-shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh;background:var(--panel)}
  .app-main{min-width:0;background:var(--panel)}
  .side-nav{position:sticky;top:0;height:100vh;z-index:40;display:flex;flex-direction:column;padding:20px 14px 18px;background:#071a31;color:#f7fbff;border-right:1px solid #16314f;overflow:auto}
  .side-brand{display:flex;align-items:center;gap:12px;padding:0 4px 26px}
  .side-brand .logo{width:46px;height:46px;border-color:#2d5dff;box-shadow:0 8px 24px rgba(40,88,255,.24)}
  .side-brand strong{display:block;font-size:22px;letter-spacing:-.45px;line-height:1.05}
  .side-brand small{display:block;margin-top:5px;color:#afbed0;font-size:10px;font-weight:700;letter-spacing:.42px;text-transform:uppercase}
  .side-menu{display:flex;flex-direction:column;gap:4px}
  .side-link{width:100%;min-height:48px;display:flex;align-items:center;gap:12px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:#c5d2df;cursor:pointer;text-align:left;font-size:14px;font-weight:620;transition:background .15s,color .15s,transform .15s}
  .side-link i{font-size:20px;color:#9fb5ca}
  .side-link:hover{background:#0d2948;color:white;transform:translateX(1px)}
  .side-link.on{background:#0e315a;color:#5c8cff;box-shadow:inset 3px 0 0 #3975ff}
  .side-link.on i{color:#5c8cff}
  .side-tech{margin:20px 8px 0;padding-top:16px;border-top:1px solid #18334f}
  .side-tech-header{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .side-tech-toggle{min-width:0;min-height:36px;display:flex;flex:1;align-items:center;gap:8px;padding:6px 7px;border:0;border-radius:7px;background:transparent;color:#91a8bd;cursor:pointer;font-size:10.5px;font-weight:780;letter-spacing:.45px;text-align:left;text-transform:uppercase}
  .side-tech-toggle span{flex:1}.side-tech-toggle i{font-size:18px;color:#c5d2df;transition:transform .16s ease}.side-tech-toggle[aria-expanded="false"] i{transform:rotate(180deg)}
  .side-tech-toggle:hover,.side-tech-toggle:focus-visible{background:#0d2948;color:#f7fbff}.side-tech-toggle:focus-visible,.side-tech-clear:focus-visible{outline:2px solid #6e99ff;outline-offset:2px}
  .side-tech-clear{min-height:32px;padding:4px 7px;border:0;border-radius:6px;background:transparent;color:#91a8bd;cursor:pointer;font-size:10.5px;font-weight:680}
  .side-tech-clear:hover:not(:disabled),.side-tech-clear:focus-visible:not(:disabled){background:#0d2948;color:#f7fbff}.side-tech-clear:disabled{opacity:.42;cursor:default}
  .side-tech-list{display:flex;flex-direction:column;gap:3px;max-height:280px;overflow:auto;padding-right:3px;scrollbar-width:thin}
  .side-tech-list[hidden]{display:none}

  .side-spacer{flex:1;min-height:26px}
  .side-bottom{padding-top:16px;border-top:1px solid #18334f}

  .topbar{height:78px;background:color-mix(in srgb,var(--panel) 96%,transparent)}

  .stats{min-height:96px;margin:0 -20px 0;padding:20px 20px;align-items:center;border-bottom:1px solid var(--line);overflow:visible;background:var(--panel)}

  .filter-panel{margin-bottom:14px}
  .filter-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .filter-toolbar .search-box{flex:1 1 250px;margin:0}
  .filter-toolbar .format-select{height:40px;margin:0;background:var(--panel)}
  .filter-toolbar #locFilter{flex:1 1 170px;min-width:160px;max-width:230px}
  .filter-toolbar .filter-row{width:auto;min-height:40px;padding:8px 11px;border:1px solid var(--line);background:var(--panel);white-space:nowrap}
  .filter-toolbar .filter-count{display:none}
  .tech-chips{display:flex;gap:7px;margin-top:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}

  .tech-chip:hover{color:var(--txt);border-color:var(--subtle)}.tech-chip.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 55%,var(--line));color:var(--accent)}

  .cal-head{margin:12px 0 11px}.cal-head h2{font-size:19px;min-width:150px}.cal-head .today{margin-left:0}
  .view-density{display:flex;margin-left:auto;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .view-density button{min-height:36px;padding:0 17px;border:0;background:var(--panel);color:var(--muted);cursor:pointer;font-size:11px;font-weight:650}
  .view-density button.on{background:var(--panel2);color:var(--txt)}
  .calendar-grid{grid-auto-rows:102px;border-radius:7px}.dow{padding-bottom:8px;text-align:center}
  .cell{padding:8px}.event-bar{height:25px;margin-top:34px;padding:3px 6px;border:0;background:transparent;font-size:10px}.event-bar[data-lane="1"]{margin-top:57px}.event-bar[data-lane="2"]{margin-top:76px;height:20px;padding-block:1px}
  .event-bar .event-dates{display:none}.event-bar:hover,.event-bar.selected{background:var(--accent-soft);box-shadow:none}
  .agenda{display:none}
  footer{padding:18px 0 0}

  @media(max-width:1320px){.app-shell{grid-template-columns:214px minmax(0,1fr)}.side-nav{padding-inline:10px}.top-action.utility .btn-label{display:none}.top-action.utility{width:40px;padding-inline:9px}.right-rail{display:none}.app-layout{grid-template-columns:minmax(0,1fr)}}
  @media(max-width:1040px){.app-shell{display:block}.side-nav{position:static;height:auto;display:block;padding:10px 14px}.side-brand{padding:0}.side-brand small,.side-bottom,.side-spacer,.side-tech{display:none}.side-menu{margin-top:10px;flex-direction:row;overflow-x:auto}.side-link{width:auto;min-width:max-content;padding:0 13px}.app-main{width:100%}.filter-toolbar{flex-wrap:nowrap;overflow-x:auto}.filter-toolbar .search-box{min-width:220px}.filter-toolbar .filter-row{display:none}.stats{overflow-x:auto}.stat-today{min-width:280px}}
  @media(max-width:760px){.topbar{height:auto}.bar{padding:10px 12px;flex-wrap:wrap}.bar>.seg{order:3;width:100%;margin:0}.bar>.seg button{flex:1;justify-content:center}.top-actions{margin-left:auto}.top-actions .utility,.menu-wrap{display:none}.app-layout{min-height:0}.workspace{padding-inline:12px}.stats{margin-inline:-12px;padding-inline:12px;min-height:82px}.stat{min-width:92px;padding-inline:13px}.stat-today{min-width:250px}.daily-brief{grid-template-columns:1fr}.brief-day+ .brief-day{border-left:0;border-top:1px solid var(--line)}.filter-toolbar{display:flex;overflow-x:auto}.filter-toolbar .search-box{min-width:250px}.filter-toolbar .format-select{min-width:135px}.calendar-inner{min-width:760px}.cal-head h2{font-size:17px}.view-density{display:none}}
</style>
</head>
<body>
<div class="app-shell">
  <aside class="side-nav" aria-label="HackCal navigation">
    <div class="side-brand">
      <img class="logo" src="assets/hackcal-logo.png" alt="HackCal logo">
      <span><strong>HackCal</strong><small>Tech Hackathon Calendar</small></span>
    </div>
    <nav class="side-menu">
      <button class="side-link on" data-side-view="month"><i class="ph ph-calendar-blank" aria-hidden="true"></i>Calendar</button>
      <button class="side-link" data-side-view="list"><i class="ph ph-list-bullets" aria-hidden="true"></i>List</button>
      <button class="side-link" id="liveBtn"><i class="ph ph-globe-hemisphere-west" aria-hidden="true"></i>Live Sync</button>
      <button class="side-link" data-nav-action="import"><i class="ph ph-tray-arrow-down" aria-hidden="true"></i>Import</button>
      <button class="side-link" data-nav-action="luma"><i class="ph ph-link" aria-hidden="true"></i>Luma</button>
      <button class="side-link" data-nav-action="discord"><i class="ph ph-discord-logo" aria-hidden="true"></i>Sync Discord</button>
      <button class="side-link" data-nav-action="export"><i class="ph ph-download-simple" aria-hidden="true"></i>Export .ics</button>
    </nav>
    <section class="side-tech" aria-labelledby="sideTechTitle">
      <div class="side-tech-header">
        <button class="side-tech-toggle" id="sideTechToggle" type="button" aria-expanded="true" aria-controls="sideTechFilters"><span id="sideTechTitle">Technologies</span><i class="ph ph-caret-up" aria-hidden="true"></i></button>
        <button class="side-tech-clear" id="sideTechClear" type="button">Clear</button>
      </div>
      <div class="side-tech-list" id="sideTechFilters" role="group" aria-label="Technology options"></div>
    </section>
    <div class="side-spacer"></div>
    <div class="side-bottom">
      <div class="side-theme-row"><span><i class="ph ph-sun" aria-hidden="true"></i>Theme</span><button class="side-mini-toggle" id="sideThemeBtn" aria-label="Toggle light and dark theme"><i class="ph ph-moon" aria-hidden="true"></i><i class="ph ph-sun" aria-hidden="true"></i></button></div>
      <button class="side-link" data-support="settings"><i class="ph ph-gear-six" aria-hidden="true"></i>Settings</button>
      <button class="side-link" data-support="feedback"><i class="ph ph-chat-circle" aria-hidden="true"></i>Feedback</button>
      <button class="side-link" data-support="help"><i class="ph ph-question" aria-hidden="true"></i>Help</button>
      <div class="side-team"><span class="side-avatar">H</span><span><strong>HackCal Team</strong><small>team@hackcal.dev</small></span></div>
    </div>
  </aside>

  <div class="app-main">
    <header class="topbar">
      <div class="bar">
        <button class="btn primary" id="addBtn"><i class="ph ph-plus" aria-hidden="true"></i><span class="btn-label">Add Hackathon</span></button>
        <div class="seg" id="viewSeg" aria-label="Calendar view">
          <button data-view="month" class="on"><i class="ph ph-calendar-blank" aria-hidden="true"></i><span>Calendar</span></button>
          <button data-view="list"><i class="ph ph-list-bullets" aria-hidden="true"></i><span>List</span></button>
        </div>
        <div class="top-actions">
          <button class="btn top-action utility" id="importBtn"><i class="ph ph-tray-arrow-down" aria-hidden="true"></i><span class="btn-label">Import</span></button>
          <button class="btn top-action utility" id="lumaBtn"><i class="ph ph-link" aria-hidden="true"></i><span class="btn-label">Luma</span></button>
          <button class="btn top-action utility" id="syncBtn"><i class="ph ph-discord-logo" aria-hidden="true"></i><span class="btn-label">Sync Discord</span></button>
          <button class="btn top-action utility" id="icsBtn"><i class="ph ph-download-simple" aria-hidden="true"></i><span class="btn-label">Export .ics</span></button>
          <div class="menu-wrap">
            <button class="btn secondary" id="toolsBtn" aria-expanded="false" aria-controls="toolsMenu"><i class="ph ph-dots-three-outline" aria-hidden="true"></i><span class="more-label">More</span><i class="ph ph-caret-down" aria-hidden="true"></i></button>
            <div class="tools-menu" id="toolsMenu" role="menu">
              <button data-tool="live" role="menuitem"><i class="ph ph-globe-hemisphere-west" aria-hidden="true"></i>Live event sync</button>
              <button data-tool="import" role="menuitem"><i class="ph ph-tray-arrow-down" aria-hidden="true"></i>Import events</button>
              <button data-tool="luma" role="menuitem"><i class="ph ph-link" aria-hidden="true"></i>Refresh Luma feed</button>
              <button data-tool="discord" role="menuitem"><i class="ph ph-discord-logo" aria-hidden="true"></i>Sync Discord</button>
              <button data-tool="export" role="menuitem"><i class="ph ph-download-simple" aria-hidden="true"></i>Export visible events</button>
              <button data-tool="reset" role="menuitem"><i class="ph ph-funnel-x" aria-hidden="true"></i>Reset filters</button>
            </div>
          </div>
          <button class="icon-btn theme-toggle" id="themeBtn" title="Switch to dark mode" aria-label="Switch to dark mode" aria-pressed="true"><i class="ph ph-sun" aria-hidden="true"></i><i class="ph ph-moon" aria-hidden="true"></i></button>
        </div>
      </div>
    </header>

    <div class="app-layout">
      <main class="workspace">
        <div class="stats" id="stats"></div>
        <section class="daily-brief" id="dailyBrief" aria-label="Today and tomorrow"></section>
        <section class="filter-panel" aria-label="Hackathon filters">
          <div class="filter-toolbar">
            <div class="search-box">
              <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
              <input class="search" id="search" aria-label="Search hackathons" placeholder="Search hackathons, tech, location…">
            </div>
            <select class="format-select" id="fmtFilter" aria-label="Filter by format">
              <option value="">All formats</option><option value="Online">Online</option><option value="In-person">In-person</option><option value="Hybrid">Hybrid</option>
            </select>
            <select class="format-select" id="locFilter" aria-label="Filter by event location">
              <option value="">All locations</option>
            </select>
            <select class="format-select" id="srcFilter" aria-label="Filter by event source">
              <option value="">All sources</option><option value="Luma">Luma</option><option value="Eventbrite">Eventbrite</option><option value="Meetup">Meetup</option><option value="Maven">Maven</option><option value="__manual">Added by me</option>
            </select>
            <button class="filter-row" id="upFilter" aria-pressed="false"><span class="checkmark"><i class="ph ph-check" aria-hidden="true"></i></span><span class="filter-label">Upcoming only</span><span class="filter-count" id="upCount">0</span></button>
            <button class="filter-row good" id="openFilter" aria-pressed="false"><span class="checkmark"><i class="ph ph-check" aria-hidden="true"></i></span><span class="filter-label">Open to register</span><span class="filter-count" id="openCount">0</span></button>
            <button class="filter-row" id="nonStuFilter" aria-pressed="false"><span class="checkmark"><i class="ph ph-check" aria-hidden="true"></i></span><span class="filter-label">Allows non-students</span><span class="filter-count" id="nonStuCount">0</span></button>
          </div>
          <div class="tech-chips" id="tagChips"></div>
          <div class="filter-footer"><span id="railEventCount">0 events</span><span><button class="text-button" id="clearTagsBtn">Clear categories</button> · <button class="text-button" id="clearFiltersBtn">Clear all</button> · <button class="text-button" id="resetFiltersBtn">Reset filters</button></span></div>
        </section>
        <section id="monthView">
          <div class="cal-head">
            <button class="nav" id="prevM" aria-label="Previous month"><i class="ph ph-caret-left" aria-hidden="true"></i></button>
            <button class="nav" id="nextM" aria-label="Next month"><i class="ph ph-caret-right" aria-hidden="true"></i></button>

            <button class="btn secondary today" id="todayBtn">Today</button>
            <div class="view-density" aria-label="Calendar density"><button class="on" type="button">Month</button><button type="button" id="weekHint">Week</button></div>
          </div>
          <div class="calendar-wrap"><div class="calendar-inner"><div class="grid" id="dow"></div><div class="grid calendar-grid" id="calGrid"></div></div></div>
          <div class="agenda" id="agendaEl"></div>
        </section>
        <section id="listView" style="display:none"><div class="list" id="listEl"></div></section>
        <footer>HackCal keeps your calendar data in this browser · <span id="ver"></span></footer>
      </main>
      <aside class="right-rail" id="rightRail" aria-label="Selected day and upcoming hackathons"></aside>
    </div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<script>
const STORE='hackcal.v1';
const TECH=['AI/ML','Web3','FinTech','HealthTech','Climate','Gaming','AR/VR','Robotics','Cybersecurity','Open Source','Mobile','Data','DevTools','Hardware'];
const FMT_COLORS={'Online':'var(--event-online)','In-person':'var(--event-person)','Hybrid':'var(--event-hybrid)'};
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const uid=()=>{
  try{ if(crypto&&crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
};
const phtParts=date=>Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Manila',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(date).filter(p=>p.type!=='literal').map(p=>[p.type,p.value]));
const todayISO=()=>{const p=phtParts(new Date());return `${p.year}-${p.month}-${p.day}`};
const shiftISO=(iso,days)=>{const d=new Date(iso+'T12:00:00+08:00');d.setUTCDate(d.getUTCDate()+days);return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`};
const phtDateLabel=iso=>new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Manila',weekday:'short',month:'short',day:'numeric'}).format(new Date(iso+'T12:00:00+08:00'));

/* ---- seed data (illustrative recurring tech hackathons, dated forward) ---- */
function seed(){
  const Y=new Date().getFullYear();
  const iso=dt=>`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
  const mk=(name,m,d,len,fmt,loc,tags,url,desc,conf,elig)=>{
    let yr=Y; const start=new Date(Y,m-1,d);
    if(start < new Date(new Date().toDateString())) yr=Y+1;
    const s=`${yr}-${pad(m)}-${pad(d)}`;
    const e=new Date(yr,m-1,d+len-1);
    const rc=new Date(yr,m-1,d-4);                // registration closes ~4 days before start
    return {id:uid(),name,start:s,end:iso(e),regClose:iso(rc),fmt,loc,tags,url,desc,dateConf:conf||'typical',eligibility:elig||'Everyone',seed:true};
  };
  return [
    mk('MLH Global Hack Week',7,13,7,'Online','Global / Virtual',['AI/ML','Open Source','DevTools'],'https://ghw.mlh.com/','Major League Hacking’s beginner-friendly week-long online event (successor to Local Hack Day).','typical','Everyone'),
    mk('ETHGlobal Hackathon',6,12,3,'In-person','New York, USA',['Web3','Open Source'],'https://ethglobal.com','Flagship Ethereum builder hackathon with major sponsor bounties (ETHGlobal New York).','confirmed','Everyone'),
    mk('AI Engineer World’s Fair',6,29,4,'In-person','San Francisco, USA',['AI/ML','DevTools','Data'],'https://www.ai.engineer/','Build agents, RAG pipelines and LLM apps; hackathon runs alongside the fair.','confirmed','Everyone'),
    mk('NASA Space Apps Challenge',11,14,2,'Hybrid','Global / 300+ cities',['Data','Open Source','Hardware'],'https://www.spaceappschallenge.org','The world’s largest annual civic hackathon, run with NASA open data.','confirmed','Everyone'),
    mk('Hack the North',9,18,3,'In-person','Waterloo, Canada',['AI/ML','Web3','Mobile'],'https://hackthenorth.com','Canada’s biggest hackathon — 1,000+ students, 36 hours.','confirmed','Students'),
    mk('ClimateHack.AI',4,5,2,'Hybrid','Global / Virtual',['Climate','Data','AI/ML'],'https://climatehack.ai/','Multi-university machine-learning competition tackling climate problems.','typical','Students'),
    mk('Money20/20 Hackathon',10,18,4,'In-person','Las Vegas, USA',['FinTech','Cybersecurity','Data'],'https://www.money2020.com/','Payments, open banking and fraud challenges at the Money20/20 fintech festival.','confirmed','Everyone'),
    mk('MIT Hacking Medicine GrandHack',3,13,3,'In-person','Cambridge, USA',['HealthTech','AI/ML'],'https://hackingmedicine.mit.edu/','Clinicians + engineers building patient-care prototypes; MIT’s flagship health hackathon.','typical','Everyone'),
    mk('Global Game Jam',1,29,3,'Online','Global / Virtual',['Gaming','AR/VR'],'https://globalgamejam.org','The world’s largest game-jam — build a playable game to a shared theme.','typical','Everyone'),
    mk('TreeHacks',2,12,3,'In-person','Stanford, USA',['AI/ML','HealthTech','Climate'],'https://treehacks.com','Stanford’s premier hackathon with deep-tech tracks.','typical','Students'),

const SEED_VER=2;                 // bump when the built-in event list changes
const VERKEY=STORE+'.seedver';
// Names of every hackathon that has ever shipped as a built-in seed (old + current),
// so a pre-versioning install can be migrated even though its rows lack seed:true.
const KNOWN_SEED_NAMES=new Set([
  'MLH Local Hack Day','ETHGlobal Hackathon','AI Engineer Hack','NASA Space Apps Challenge',
  'Hack the North','Climate Hack','FinTech DevCon Hack','HealthHacks','GameDev Jam','TreeHacks',
  'Cybersec CTF & Build','Robotics Build Weekend','Junction','Mobile App Sprint','Open Source Day',
  'AR/VR Reality Hack','MLH Global Hack Week','AI Engineer World’s Fair','ClimateHack.AI',
  'Money20/20 Hackathon','MIT Hacking Medicine GrandHack','Global Game Jam','picoCTF','MakeMIT',
  'PennApps','Hacktoberfest','MIT Reality Hack'
]);
const isSeedRow=e=>e.seed===true || (!e.src && KNOWN_SEED_NAMES.has(e.name));
let data;
data = load();
function load(){
  let v=null; try{v=JSON.parse(localStorage.getItem(STORE));}catch(e){}
  if(!Array.isArray(v)||!v.length){ const s=seed(); localStorage.setItem(VERKEY,SEED_VER); save(s); return s; }
  const ver=+(localStorage.getItem(VERKEY)||0);
  if(ver<SEED_VER){
    // Refresh built-in events (fixes stale placeholder URLs / dates) while keeping
    // anything the user added or imported (has src, or a non-seed name).
    const userRows=v.filter(e=>!isSeedRow(e));
    const merged=seed().concat(userRows);
    localStorage.setItem(VERKEY,SEED_VER); save(merged); return merged;
  }
  return v;
}
function save(d){data=d||data; localStorage.setItem(STORE,JSON.stringify(data))}

/* ---- filtering ---- */
function filtered(){
  const t=todayISO();
  return data.filter(ev=>{
    if(fmtF && ev.fmt!==fmtF) return false;
    if(locF && ev.loc!==locF) return false;
    if(upOnly && ev.end < t) return false;
    if(openOnly && !isOpenForReg(ev)) return false;
    if(nonStuOnly && ev.eligibility==='Students') return false;
    if(srcF==='__manual'){ if(ev.src) return false; }
    else if(srcF && ev.src!==srcF) return false;
    if(activeTags.size && !ev.tags.some(x=>activeTags.has(x))) return false;
    if(q){
      const hay=(ev.name+' '+ev.loc+' '+ev.tags.join(' ')+' '+(ev.desc||'')).toLowerCase();
      if(!hay.includes(q.toLowerCase())) return false;
    }
    return true;
  });
}

function renderMonth(){
  const dowEl=$('#dow'); dowEl.innerHTML='';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=>{
    const x=document.createElement('div'); x.className='dow'; x.textContent=d; dowEl.appendChild(x);
  });
  $('#monthLabel').textContent=cur.toLocaleString('default',{month:'long',year:'numeric'});
  const grid=$('#calGrid'); grid.innerHTML='';
  const first=new Date(cur.getFullYear(),cur.getMonth(),1);
  const startDow=first.getDay();
  const daysIn=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate();
  const prevDays=new Date(cur.getFullYear(),cur.getMonth(),0).getDate();
  const evs=filtered();
  const cells=[];
  for(let i=0;i<startDow;i++) cells.push({d:prevDays-startDow+1+i,out:true,mo:cur.getMonth()-1});
  for(let i=1;i<=daysIn;i++) cells.push({d:i,out:false,mo:cur.getMonth()});
  while(cells.length%7) cells.push({d:cells.length-startDow-daysIn+1,out:true,mo:cur.getMonth()+1});

  cells.forEach((c,index)=>{
    const dt=new Date(cur.getFullYear(),c.mo,c.d);
    const iso=`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
    c.iso=iso;
    const cell=document.createElement('div');
    cell.className='cell'+(c.out?' out':'')+(iso===todayISO()?' today':'');
    cell.style.gridColumn=String(index%7+1);
    cell.style.gridRow=String(Math.floor(index/7)+1);
    cell.innerHTML=`<div class="daynum"><span>${c.d}</span></div>`;
    grid.appendChild(cell);
  });

  const chosen=selectedEvent(evs);
  const gridStart=new Date(cells[0].iso+'T00:00');
  const lastIndex=cells.length-1;
  const laneUse=Array.from({length:cells.length/7},()=>[[],[],[]]);
  const visible=evs.filter(e=>e.end>=cells[0].iso&&e.start<=cells[lastIndex].iso).sort((a,b)=>a.start.localeCompare(b.start)||b.end.localeCompare(a.end));
  visible.forEach(e=>{
    let start=Math.max(0,Math.round((new Date(e.start+'T00:00')-gridStart)/864e5));
    const end=Math.min(lastIndex,Math.round((new Date(e.end+'T00:00')-gridStart)/864e5));
    while(start<=end){
      const row=Math.floor(start/7), rowEnd=Math.min(end,row*7+6), col=start%7;
      let lane=laneUse[row].findIndex(items=>items.every(([a,b])=>rowEnd<a||start>b));
      if(lane<0)lane=2;
      laneUse[row][lane].push([start,rowEnd]);
      const bar=document.createElement('button');
      bar.className='event-bar'+(chosen&&chosen.id===e.id?' selected':'');
      bar.dataset.lane=lane;
      bar.style.gridColumn=`${col+1} / ${rowEnd%7+2}`;
      bar.style.gridRow=String(row+1);
      bar.style.setProperty('--event-color',evColor(e));
      bar.setAttribute('aria-label',`${e.name}, ${fmtDate(e.start)} to ${fmtDate(e.end)}`);
      bar.innerHTML=`<span class="status-dot" style="background:${evColor(e)}"></span>${esc(e.name)}<span class="event-dates">${fmtShort(e.start)}${e.start!==e.end?' – '+fmtShort(e.end):''}</span>`;
      bar.onclick=()=>selectEvent(e);
      bar.ondblclick=()=>selectEvent(e,true);
      grid.appendChild(bar);
      start=rowEnd+1;
    }
  });
  renderAgenda();
}

function fmtDate(iso){const d=new Date(iso+'T00:00');return d.toLocaleDateString('default',{month:'short',day:'numeric',year:'numeric'})}
function fmtShort(iso){const d=new Date(iso+'T00:00');return d.toLocaleDateString('default',{month:'short',day:'numeric'})}
function venueHref(e){
  const location=(e.loc||'').trim();
  if(/^https?:\/\//i.test(location)) return location;
  if(!location || /online|virtual|remote|global|see event page|zoom|google meet/i.test(location)) return e.url||`https://www.google.com/search?q=${encodeURIComponent((e.name||'Event')+' venue')}`;
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(location)}`;
}
function venueLink(e){
  const label=(e.loc||'Venue details').trim();
  const online=/online|virtual|remote|global|see event page|zoom|google meet/i.test(label);
  const title=online?'Open online event venue':'Open event venue in Google Maps';
  return `<a class="venue-link" href="${esc(venueHref(e))}" target="_blank" rel="noopener noreferrer" title="${title}" onclick="event.stopPropagation()">${esc(label)} <i class="ph ph-arrow-square-out" aria-hidden="true"></i></a>`;
}
function daysBetween(a,b){return Math.ceil((new Date(a)-new Date(b))/864e5)}
// Registration status for an event, derived from regOpen/regClose (or start as fallback).
function regStatus(e){
  const t=todayISO();
  if(e.end < t) return {label:'Event ended', short:'Ended', cls:'closed'};
  if(e.regOpen && t < e.regOpen) return {label:'Opens '+fmtShort(e.regOpen), short:'Opens later', cls:'preopen'};
  const rc = e.regClose || e.start;
  if(t > rc){
    // deadline passed but event not over → registration closed (may be in progress)
    return {label: e.start<=t ? 'Registration closed · in progress' : 'Registration closed', short:'Registration closed', cls:'closed'};
  }
  const days=daysBetween(rc,t);
  if(days<=7) return {label: days<=0?'Closes today':`Closing soon · ${days}d left`, short:'Closing soon', cls:'soon'};
  return {label:`Open · until ${fmtShort(rc)}`, short:'Open to register', cls:'open'};
}
function isOpenForReg(e){const s=regStatus(e);return s.cls==='open'||s.cls==='soon'}
function eligBadge(e){
  return e.eligibility==='Students'
    ? `<span class="tag" style="border-color:var(--warn);color:var(--warn)"><i class="ph ph-student" aria-hidden="true"></i>Students only</span>`
    : `<span class="tag" style="border-color:var(--good);color:var(--good)"><i class="ph ph-users" aria-hidden="true"></i>Open to all</span>`;
}
const approx=e=>e.dateConf==='typical'?'≈ ':'';

  evs.forEach(e=>{
    const d=new Date(e.start+'T00:00');

    const cd= e.end<t ? 'Past' : (dd<=0?'Live / Today':dd+' days');

    const card=document.createElement('div'); card.className='card'+(e.id===selectedEventId?' selected':''); card.onclick=()=>selectEvent(e);
    card.ondblclick=()=>selectEvent(e,true);
    card.innerHTML=`
      <div class="date-badge">
        <div class="m">${d.toLocaleString('default',{month:'short'})}</div>
        <div class="d">${d.getDate()}</div>

        <div class="meta">

        </div>
      </div>

    el.appendChild(card);

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ---- detail modal (swipe / arrow navigable) ---- */
let detailList=[], detailIdx=-1;
function openDetail(e){
  // Navigate within the events currently shown (same order as the list view).
  detailList = filtered().slice().sort((a,b)=>a.start.localeCompare(b.start));
  detailIdx = detailList.findIndex(x=>x.id===e.id);
  if(detailIdx<0){ detailList=[e]; detailIdx=0; }
  renderDetail();
}
function navDetail(step){
  if(detailList.length<2) return;
  detailIdx = (detailIdx + step + detailList.length) % detailList.length;
  renderDetail();
}
function renderDetail(){
  const e=detailList[detailIdx]; if(!e) return;
  modalMode='detail';
  const t=todayISO();
  const dd=Math.ceil((new Date(e.start)-new Date(t))/864e5);
  const status = e.end<t?'Past event':(dd<=0?'Happening now':`In ${dd} day${dd===1?'':'s'}`);
  const nav = detailList.length>1;
  $('#modal').innerHTML=`
    <button class="close" onclick="closeModal()" aria-label="Close"><i class="ph ph-x" aria-hidden="true"></i></button>
    ${nav?`<div style="display:flex;align-items:center;gap:10px;margin:-4px 0 10px;color:var(--muted);font-size:12.5px">
      <button class="nav" style="width:30px;height:30px;font-size:15px" onclick="navDetail(-1)" aria-label="Previous event"><i class="ph ph-caret-left" aria-hidden="true"></i></button>
      <span>${detailIdx+1} / ${detailList.length}</span>
      <button class="nav" style="width:30px;height:30px;font-size:15px" onclick="navDetail(1)" aria-label="Next event"><i class="ph ph-caret-right" aria-hidden="true"></i></button>
      <span style="margin-left:auto;opacity:.75">swipe / arrow keys to browse</span>
    </div>`:''}
    <h2>${esc(e.name)}</h2>

/* ---- .ics export ---- */
function icsDate(iso){return iso.replace(/-/g,'')}
function icsForEvents(evs){
  let out='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//HackCal//EN\r\nCALSCALE:GREGORIAN\r\n';
  evs.forEach(e=>{
    const endNext=new Date(e.end+'T00:00'); endNext.setDate(endNext.getDate()+1);
    const dtend=`${endNext.getFullYear()}${pad(endNext.getMonth()+1)}${pad(endNext.getDate())}`;
    out+='BEGIN:VEVENT\r\n';
    out+=`UID:${e.id}@hackcal\r\n`;
    out+=`DTSTART;VALUE=DATE:${icsDate(e.start)}\r\n`;
    out+=`DTEND;VALUE=DATE:${dtend}\r\n`;
    out+=`SUMMARY:${icsEsc(e.name)}\r\n`;
    out+=`LOCATION:${icsEsc(e.loc)}\r\n`;
    out+=`DESCRIPTION:${icsEsc((e.fmt+' · '+e.tags.join(', ')+(e.desc?' — '+e.desc:'')+(e.url?'\\n'+e.url:'')))}\r\n`;
    if(e.url) out+=`URL:${e.url}\r\n`;
    out+='END:VEVENT\r\n';
  });
  out+='END:VCALENDAR\r\n'; return out;
}
function icsEsc(s){return String(s).replace(/[\\,;]/g,m=>'\\'+m).replace(/\n/g,'\\n')}
function downloadFile(name,text){
  const b=new Blob([text],{type:'text/calendar'}); const u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name; a.click(); URL.revokeObjectURL(u);
}
function downloadICS(id){const e=data.find(x=>x.id===id); downloadFile(slug(e.name)+'.ics',icsForEvents([e]))}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}

var parsedPreview=[];
const MONTHS={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11,
  january:0,february:1,march:2,april:3,june:5,july:6,august:7,september:8,october:9,november:10,december:11};
function inferYear(y,mo,d){
  if(y) return y<100?y+2000:y;

  if(new Date(yr,mo,d)<now) yr++; return yr;

const isoOf=(y,mo,d)=>`${y}-${pad(mo+1)}-${pad(d)}`;

function parseDates(text){

  if(m=text.match(reMD)){
    const mo=MONTHS[m[1].toLowerCase().replace('.','')], d1=+m[2], d2=m[3]?+m[3]:null;
    const yr=inferYear(m[4]?+m[4]:ctxYear(text),mo,d1);
    return {start:isoOf(yr,mo,d1),end:isoOf(yr,mo,d2||d1)};
  }
  const reDM=/\b(\d{1,2})\s+(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t)?(?:ember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\.?(?:\s+(\d{4}))?/i;
  if(m=text.match(reDM)){
    const mo=MONTHS[m[2].toLowerCase().replace('.','')], d=+m[1]; const yr=inferYear(m[3]?+m[3]:ctxYear(text),mo,d);
    return {start:isoOf(yr,mo,d),end:isoOf(yr,mo,d)};
  }
  const reISO=/(\d{4})-(\d{2})-(\d{2})(?:\s*(?:[-–—]|to)\s*(\d{4})-(\d{2})-(\d{2}))?/;
  if(m=text.match(reISO)){
    const start=`${m[1]}-${m[2]}-${m[3]}`; return {start,end:m[4]?`${m[4]}-${m[5]}-${m[6]}`:start};
  }
  const reNum=/\b(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{2,4}))?\b/;
  if(m=text.match(reNum)){
    let a=+m[1],b=+m[2],y=m[3]?+m[3]:null,mo,d;
    if(a>12){d=a;mo=b-1;} else if(b>12){mo=a-1;d=b;} else {mo=a-1;d=b;}
    if(mo<0||mo>11||d<1||d>31) return null;
    return {start:isoOf(inferYear(y,mo,d),mo,d),end:isoOf(inferYear(y,mo,d),mo,d)};

}
function stripChatMeta(line){
  let s=line;

function pickFmt(t){

  if(m) return m[1].trim().slice(0,60);
  m=t.match(/\bat\s+([A-Z][A-Za-z0-9 '&-]{2,40})/);
  if(m) return m[1].trim().replace(/[.,]+$/,'');
  if(/\b(online|virtual|remote|discord|zoom|gather)\b/i.test(t)) return 'Online / Virtual';
  return fmt==='Online'?'Online / Virtual':'TBD';
}
const TAGMAP=[
  [/\b(ai|machine learning|ml|llm|genai|deep learning|agents?)\b/i,'AI/ML'],
  [/\b(web3|blockchain|crypto|ethereum|solana|defi|nft)\b/i,'Web3'],
  [/\b(fintech|payments?|banking)\b/i,'FinTech'],
  [/\b(health|medical|biotech|medtech)\b/i,'HealthTech'],
  [/\b(climate|sustainab|carbon|cleantech|energy)\b/i,'Climate'],
  [/\b(game|gaming|gamedev|game ?jam)\b/i,'Gaming'],
  [/\b(ar|vr|xr|augmented|virtual reality|metaverse)\b/i,'AR/VR'],
  [/\b(robot|robotics)\b/i,'Robotics'],
  [/\b(security|cyber|infosec|ctf)\b/i,'Cybersecurity'],
  [/\b(open ?source|oss)\b/i,'Open Source'],
  [/\b(mobile|ios|android|flutter|react native)\b/i,'Mobile'],
  [/\b(data|datathon|analytics)\b/i,'Data'],
  [/\b(devtools?|developer tools?|api|sdk)\b/i,'DevTools'],
  [/\b(hardware|iot|embedded|electronics)\b/i,'Hardware'],

function pickTags(t){const out=[];TAGMAP.forEach(([re,tag])=>{if(re.test(t)&&!out.includes(tag))out.push(tag)});return out.slice(0,5)}
function pickTitle(text){
  let line=(text.split('\n').find(l=>/[a-z]/i.test(l.replace(/https?:\/\/\S+/g,'')))||text.split('\n')[0]||'')
    .replace(/https?:\/\/\S+/g,'').trim();
  // Cut the name at the earliest of: a date, a sentence end, or a connector phrase.
  const cuts=[];
  const dm=line.match(/\b(?:jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s*\d{1,2}\b|\b\d{4}-\d{2}-\d{2}\b|\b\d{1,2}[\/.]\d{1,2}(?:[\/.]\d{2,4})?\b/i);

const isWAStart=l=>/^\s*\[?\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4},?\s+\d{1,2}:\d{2}/.test(l);

// Reconstruct individual messages from pasted chat text, so each event is its
// own candidate (WhatsApp = one message per line; Discord = name/time header
// line followed by the message body; plain paste = blank-line separated blocks).
function segmentMessages(raw){
  const lines=(raw||'').split(/\r?\n/); const msgs=[]; let cur=null;
  for(const ln of lines){
    if(isWAStart(ln)){ const body=stripChatMeta(ln); cur={l:[]}; msgs.push(cur); if(body)cur.l.push(body); }
    else if(isDiscordHeader(ln)){ cur={l:[]}; msgs.push(cur); }   // drop the "Name Today at…" header
    else if(!ln.trim()){ cur=null; }                              // blank line = boundary
    else { const body=stripChatMeta(ln); if(!body)continue; if(!cur){cur={l:[]};msgs.push(cur);} cur.l.push(body); }
  }

}

}
/* ---- iCalendar (.ics) parsing — for Luma, Google Calendar, Meetup, Eventbrite… ---- */
const icsUnesc=s=>String(s||'').replace(/\\n/gi,' ').replace(/\\,/g,',').replace(/\\;/g,';').replace(/\\\\/g,'\\').trim();
const icsToISO=v=>{const m=(v||'').match(/(\d{4})(\d{2})(\d{2})/);return m?`${m[1]}-${m[2]}-${m[3]}`:null;};

function parseICS(raw,source){
  const unfolded=String(raw||'').replace(/\r\n/g,'\n').replace(/\n[ \t]/g,''); // RFC5545 line unfolding
  const blocks=unfolded.split(/BEGIN:VEVENT/i).slice(1).map(b=>b.split(/END:VEVENT/i)[0]);
  const events=[];
  for(const b of blocks){
    const get=name=>{const m=b.match(new RegExp('(?:^|\\n)'+name+'(;[^:\\n]*)?:(.*)','i'));return m?m[2].trim():'';};
    const summary=icsUnesc(get('SUMMARY')); if(!summary) continue;
    const dtStartRaw=get('DTSTART'), dtEndRaw=get('DTEND');
    const start=icsToISO(dtStartRaw); if(!start) continue;
    let end=icsToISO(dtEndRaw)||start;
    const startLine=(b.match(/(?:^|\n)DTSTART[^:\n]*/i)||[''])[0];
    const dateOnly=/VALUE=DATE\b/i.test(startLine)||/^\d{8}$/.test(dtStartRaw);
    if(dateOnly && end>start){const d=new Date(end);d.setDate(d.getDate()-1);end=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;} // all-day DTEND is exclusive
    const loc=icsUnesc(get('LOCATION'));
    const desc=icsUnesc(get('DESCRIPTION'));
    const url=(get('URL')||(desc.match(/https?:\/\/\S+/)||[''])[0]||'').replace(/[).,]+$/,'');
    const hay=summary+' '+desc+' '+loc;
    const locIsUrl=/^https?:\/\//i.test(loc);
    const physicalLoc=loc && !locIsUrl && !/online|virtual|remote|zoom|meet\.|google meet|gather|hopin/i.test(loc);
    const hasGeo=/(?:^|\n)GEO:/i.test(b);   // physical coordinates ⇒ in-person
    let fmt;
    if(/\bhybrid\b/i.test(hay)) fmt='Hybrid';
    else if(/\b(online|virtual|remote)\b/i.test(hay)) fmt='Online';
    else if(physicalLoc || hasGeo) fmt='In-person';   // real venue in the .ics
    else fmt='Online';
    const displayLoc = physicalLoc ? loc.slice(0,60)
      : (locIsUrl || hasGeo) ? 'See event page'
      : (fmt==='Online' ? 'Online / Virtual' : 'TBD');
    events.push({id:uid(),name:summary.slice(0,90),start,end,fmt,loc:displayLoc,
      tags:pickTags(hay),url,regClose:pickRegClose(desc)||'',
      eligibility:pickElig(hay),dateConf:'confirmed',
      desc:(desc||summary).replace(/\s+/g,' ').trim().slice(0,240),src:source||'Luma'});
  }
  return events;
}

  }catch(e){
    $('#imp_preview').innerHTML='<p style="color:var(--bad);margin-top:14px;font-size:13.5px">Could not fetch feed: '+esc(e.message)+'</p>';
  }finally{ btn.innerHTML=o; btn.disabled=false; }
}
function runParse(){
  const src=$('#imp_src').value;
  const txt=$('#imp_text').value;
  parsedPreview = isICS(txt) ? parseICS(txt, src==='Discord'||src==='WhatsApp'?'Import':src)
                             : parseEvents(txt, src==='Luma'?'Import':src);
  const box=$('#imp_preview');
  if(!parsedPreview.length){
    box.innerHTML='<p style="color:var(--bad);margin-top:14px;font-size:13.5px">No events with a recognizable date found. Make sure each event includes a date like “March 14”, “14 March 2026” or “2026-03-14”.</p>';
    return;
  }
  box.innerHTML=`<div style="margin-top:18px;border-top:1px solid var(--line);padding-top:14px">
    <b>${parsedPreview.length} event${parsedPreview.length>1?'s':''} detected</b>
    <div id="imp_list" style="display:flex;flex-direction:column;gap:8px;margin-top:10px"></div>
    <div class="modal-actions"><button class="btn primary" onclick="confirmImport()"><i class="ph ph-plus" aria-hidden="true"></i>Import selected</button></div></div>`;
  const list=$('#imp_list');
  parsedPreview.forEach((e,i)=>{
    const row=document.createElement('label');
    row.style.cssText='display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer';
    row.innerHTML=`<input type="checkbox" data-i="${i}" checked style="margin-top:3px;accent-color:var(--accent)">
      <div style="flex:1">
        <div style="font-weight:700">${esc(e.name)}</div>
        <div style="color:var(--muted);font-size:12.5px">${fmtDate(e.start)}${e.start!==e.end?' – '+fmtDate(e.end):''} · ${e.fmt} · ${venueLink(e)}</div>
        ${e.tags.length?`<div class="meta">${e.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>`:''}
      </div>`;
    list.appendChild(row);
  });
}
function confirmImport(){
  const checked=[...document.querySelectorAll('#imp_list input:checked')].map(c=>parsedPreview[+c.dataset.i]);
  if(!checked.length){toast('Nothing selected');return}
  const added=mergeEvents(checked);
  const dupes=checked.length-added;
  closeModal(); render();
  toast(`Imported ${added} event${added===1?'':'s'}`+(dupes>0?` · ${dupes} duplicate${dupes===1?'':'s'} skipped`:''));
}

/* ================= LIVE SYNC =================
   Pulls real, current listings from /api/live-events (Luma, Eventbrite, Meetup,
   Maven) and upserts them by their source id, so re-syncing refreshes an event's
   dates instead of piling up duplicates. LinkedIn and Facebook can't be fetched
   server-side (both hard-gate signed-out visitors), so they're surfaced in the
   panel with a search link and the paste-import path instead. */
const LIVE_KEY='hackcal.live';
const LIVE_SOURCES=[
  {id:'luma',      label:'Luma',       icon:'ph-link', live:true},
  {id:'eventbrite',label:'Eventbrite', icon:'ph-ticket', live:true},
  {id:'meetup',    label:'Meetup',     icon:'ph-users-three', live:true},
  {id:'maven',     label:'Maven',      icon:'ph-graduation-cap', live:true, note:'live cohort courses'},
  {id:'linkedin',  label:'LinkedIn',   icon:'ph-linkedin-logo', live:false},
  {id:'facebook',  label:'Facebook',   icon:'ph-facebook-logo', live:false}
];
const SRC_ICONS={Luma:'ph-link',Eventbrite:'ph-ticket',Meetup:'ph-users-three',Maven:'ph-graduation-cap',Discord:'ph-discord-logo',WhatsApp:'ph-whatsapp-logo'};
const srcIcon=s=>`<i class="ph ${SRC_ICONS[s]||'ph-arrow-square-in'}" aria-hidden="true"></i>`;

const LIVE_DEFAULTS={sources:['luma','eventbrite','meetup','maven'],filter:'hack',q:'hackathon',auto:15,lastSync:null,report:null};
function liveCfg(){
  let c={}; try{c=JSON.parse(localStorage.getItem(LIVE_KEY))||{}}catch(e){}
  return Object.assign({},LIVE_DEFAULTS,c);
}
function saveLiveCfg(patch){
  const c=Object.assign(liveCfg(),patch);
  localStorage.setItem(LIVE_KEY,JSON.stringify(c));
  return c;
}

// Map an aggregator record onto a HackCal event, reusing the existing tag /
// eligibility / registration heuristics so live rows behave like imported ones.
function fromLive(r){
  const hay=[r.name,r.desc,r.loc,r.hay].filter(Boolean).join(' ');
  return {
    id:uid(), extId:r.extId, name:r.name, start:r.start, end:r.end||r.start,
    fmt:r.fmt||'Online', loc:r.loc||'See event page',
    tags:pickTags(hay), url:r.url||'',
    regClose:r.regClose||pickRegClose(r.desc||'')||'',
    eligibility:pickElig(hay), dateConf:'confirmed',
    // Luma exposes no blurb in its discover feed — don't echo the title as a description
    desc:(r.desc&&r.desc.trim()!==r.name.trim()?r.desc:'').slice(0,240),
    src:r.src, kind:r.kind||'', live:true
  };
}

// Upsert by extId; fall back to name+date so a live row never duplicates an
// event the user already added by hand or imported from a feed.
function upsertLive(records){
  const byExt=new Map(); data.forEach(e=>{if(e.extId)byExt.set(e.extId,e)});
  const byKey=new Set(data.map(evKey));
  let added=0, updated=0;
  for(const r of records){
    if(!r||!r.name||!r.start) continue;
    const ev=fromLive(r);
    const cur=byExt.get(ev.extId);
    if(cur){
      const changed = cur.start!==ev.start||cur.end!==ev.end||cur.name!==ev.name||
                      cur.loc!==ev.loc||cur.fmt!==ev.fmt||cur.url!==ev.url;
      if(changed){
        byKey.delete(evKey(cur));
        Object.assign(cur,{name:ev.name,start:ev.start,end:ev.end,fmt:ev.fmt,
          loc:ev.loc,url:ev.url,desc:ev.desc,tags:ev.tags,regClose:ev.regClose});
        byKey.add(evKey(cur)); updated++;
      }
      continue;
    }
    if(byKey.has(evKey(ev))) continue;      // already present from another path
    data.push(ev); byExt.set(ev.extId,ev); byKey.add(evKey(ev)); added++;
  }
  // Live feeds rotate what they surface, so each sync can legitimately turn up
  // events the last one missed. Retire long-past live rows (never user-added or
  // seed ones) so months of syncing can't grow localStorage without bound.
  const cutoff=new Date(Date.now()-30*864e5).toISOString().slice(0,10);
  const before=data.length;
  const kept=data.filter(e=>!(e.live && e.end < cutoff));
  const pruned=before-kept.length;
  if(pruned) data=kept;
  if(added||updated||pruned) save();
  return {added,updated,pruned};
}

let liveBusy=false;
async function liveSync(silent){
  if(liveBusy) return; liveBusy=true;
  const cfg=liveCfg();
  const btn=$('#liveBtn'), orig=btn?btn.innerHTML:'';
  if(btn){btn.innerHTML='<i class="ph ph-spinner-gap" aria-hidden="true"></i><span class="btn-label">Syncing…</span>'; btn.disabled=true;}
  try{
    const url='/api/live-events?q='+encodeURIComponent(cfg.q||'hackathon')+
      '&sources='+encodeURIComponent(cfg.sources.join(','))+
      '&filter='+encodeURIComponent(cfg.filter||'hack')+'&_='+Date.now();
    const r=await fetch(url);
    const j=await r.json().catch(()=>({}));
    if(r.status===404){ if(!silent) toast('Live sync needs the /api/live-events function — deploy the app to Vercel to enable it.'); return; }
    if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
    const {added,updated}=upsertLive(j.events||[]);
    saveLiveCfg({lastSync:j.fetchedAt||new Date().toISOString(),report:j.sources||[]});
    render();
    if(modalMode==='live') openLive();          // refresh the panel's status table in place
    if(!silent||added||updated){
      const bits=[`${j.count||0} live listing${j.count===1?'':'s'}`];
      if(added) bits.push(`${added} new`);
      if(updated) bits.push(`${updated} updated`);
      if(!added&&!updated) bits.push('already up to date');
      toast('Live sync · '+bits.join(' · '));
    }
  }catch(err){
    if(!silent) toast('Live sync failed: '+err.message);
  }finally{
    liveBusy=false;
    if(btn){btn.innerHTML=orig||'<i class="ph ph-globe-hemisphere-west" aria-hidden="true"></i><span class="btn-label">Live Sync</span>'; btn.disabled=false;}
  }
}

/* auto-refresh: interval while the tab is open, plus a catch-up when you come back */
let liveTimer=null;
function startAutoSync(){
  if(liveTimer){clearInterval(liveTimer);liveTimer=null}
  const mins=+liveCfg().auto||0;
  if(mins>0) liveTimer=setInterval(()=>liveSync(true),mins*60000);
}
function liveStale(){
  const c=liveCfg(); if(!c.auto) return false;
  if(!c.lastSync) return true;
  return (Date.now()-new Date(c.lastSync).getTime())/60000 >= +c.auto;
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&liveStale()) liveSync(true) });

function agoText(iso){
  if(!iso) return 'never';
  const m=Math.round((Date.now()-new Date(iso).getTime())/60000);
  if(m<1) return 'just now';
  if(m<60) return m+'m ago';
  const h=Math.round(m/60); return h<24? h+'h ago' : Math.round(h/24)+'d ago';
}

function openLive(){
  modalMode='live';
  const c=liveCfg();
  const rep={}; (c.report||[]).forEach(s=>rep[s.source]=s);
  const rows=LIVE_SOURCES.map(s=>{
    const r=rep[s.id]||{};
    const on=c.sources.includes(s.id);
    const status = !s.live
      ? `<span style="color:var(--muted)">login-only</span>`
      : r.ok ? `<span style="color:var(--good)"><i class="ph ph-check-circle" aria-hidden="true"></i> ${r.count} found</span>`
      : (r.error?`<span style="color:#f87171">failed</span>`:`<span style="color:var(--muted)">—</span>`);
    const searchHref = s.id==='linkedin'
      ? 'https://www.linkedin.com/search/results/events/?keywords='+encodeURIComponent(c.q||'hackathon')
      : 'https://www.facebook.com/events/search/?q='+encodeURIComponent(c.q||'hackathon');
    return `<label class="live-row">
      <input type="checkbox" class="live-src" value="${s.id}" ${on?'checked':''} ${s.live?'':'disabled'}>
      <span class="ic"><i class="ph ${s.icon}" aria-hidden="true"></i></span>
      <span class="nm"><b>${s.label}</b>${s.note?` <span style="color:var(--muted);font-size:12px">· ${s.note}</span>`:''}
        ${!s.live?`<div class="note">Can’t be fetched automatically — ${s.label} blocks signed-out access.
          <a href="${searchHref}" target="_blank" rel="noopener" style="color:var(--accent)">Search ${s.label} →</a>
          then paste the results into Import.</div>`:''}
      </span>
      <span class="st">${status}</span>
    </label>`;
  }).join('');
  $('#modal').innerHTML=`
    <button class="close" onclick="closeModal()">×</button>
    <h2 style="margin:0"><i class="ph ph-globe-hemisphere-west" aria-hidden="true"></i> Live Sync</h2>
    <p style="color:var(--muted);font-size:13px;margin:6px 0 0">Pulls current listings straight from each site. Last synced: <b>${agoText(c.lastSync)}</b></p>
    <div style="margin-top:16px"><div class="fieldlabel">Sources</div>${rows}</div>
    <div class="row2">
      <div class="field"><label>What to pull</label>
        <select id="live_filter">
          <option value="hack" ${c.filter==='hack'?'selected':''}>Hackathons &amp; build events (+ Maven courses)</option>
          <option value="tech" ${c.filter==='tech'?'selected':''}>All tech events</option>
          <option value="all"  ${c.filter==='all'?'selected':''}>Everything found</option>
        </select>
      </div>
      <div class="field"><label>Auto-refresh</label>
        <select id="live_auto">
          <option value="0"  ${+c.auto===0?'selected':''}>Off</option>
          <option value="5"  ${+c.auto===5?'selected':''}>Every 5 minutes</option>
          <option value="15" ${+c.auto===15?'selected':''}>Every 15 minutes</option>
          <option value="60" ${+c.auto===60?'selected':''}>Every hour</option>
        </select>
      </div>
    </div>
    <div class="field"><label>Search terms (comma-separated)</label>
      <input id="live_q" value="${esc(c.q||'hackathon')}" placeholder="hackathon, game jam, ctf"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Close</button>
      <button class="btn primary" onclick="saveLiveAndSync()"><i class="ph ph-arrows-clockwise" aria-hidden="true"></i>Sync now</button>
    </div>`;
  showModal();
}
function saveLiveAndSync(){
  saveLiveCfg({
    sources:[...document.querySelectorAll('.live-src:checked')].map(c=>c.value),
    filter:$('#live_filter').value,
    auto:+$('#live_auto').value,
    q:$('#live_q').value.trim()||'hackathon'
  });
  startAutoSync();
  liveSync(false);
}

/* ---- Discord auto-sync via serverless /api/discord-events ---- */
async function syncDiscord(){
  const btn=$('#syncBtn'), orig=btn.innerHTML; btn.innerHTML='<i class="ph ph-spinner-gap" aria-hidden="true"></i><span class="btn-label">Syncing…</span>'; btn.disabled=true;
  try{
    const r=await fetch('/api/discord-events');
    const j=await r.json().catch(()=>({}));
    // Not-configured (or endpoint not deployed) is an expected state, not an error.
    if(j.configured===false || r.status===404){
      toast('Discord auto-sync isn’t set up. Use Import to paste event messages, or add a bot token in Vercel to enable it.');
      return;
    }
    if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
    const text=(j.messages||[]).join('\n\n');
    const evs=parseEvents(text,'Discord');
    const added=mergeEvents(evs);
    render();
    toast(`Discord: scanned ${j.messages?j.messages.length:0} messages · added ${added} event${added===1?'':'s'}`);
  }catch(err){
    toast('Couldn’t reach Discord right now. Try Import to paste messages instead.');
  }finally{ btn.innerHTML=orig; btn.disabled=false; }
}

/* ---- Luma / .ics feed sync (remembers your feed URL for one-click refresh) ---- */
async function syncLuma(){
  const saved=localStorage.getItem('hackcal.icsurl');
  if(!saved){ openImport(); $('#imp_src').value='Luma'; impSrcChange(); $('#imp_url').focus();
    toast('Paste your Luma subscription / .ics link, then Fetch'); return; }
  const btn=$('#lumaBtn'), orig=btn.innerHTML; btn.innerHTML='<i class="ph ph-spinner-gap" aria-hidden="true"></i><span class="btn-label">Refreshing…</span>'; btn.disabled=true;
  try{
    const ics=await fetchIcs(saved);
    const evs=parseICS(ics,'Luma');
    const added=mergeEvents(evs);
    render();
    toast(`Luma: scanned ${evs.length} event${evs.length===1?'':'s'} · added ${added}`);
  }catch(err){
    toast('Luma sync failed: '+err.message+' — reset the link via Import');
  }finally{ btn.innerHTML=orig; btn.disabled=false; }
}

/* ---- theme ---- */
function applyTheme(th){
  document.documentElement.setAttribute('data-theme',th);
  const b=$('#themeBtn');
  if(b){
    const next=th==='light'?'dark':'light';
    b.title=`Switch to ${next} mode`;
    b.setAttribute('aria-label',`Switch to ${next} mode`);
    b.setAttribute('aria-pressed',th==='light');
  }
  const side=$('#sideThemeBtn');
  if(side){
    const next=th==='light'?'dark':'light';
    side.title=`Switch to ${next} mode`;
    side.setAttribute('aria-label',`Switch to ${next} mode`);
    side.setAttribute('aria-pressed',th==='light');
  }
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.content=th==='light'?'#ffffff':'#07111f';
  localStorage.setItem('hackcal.theme',th);
}

function openTelegramInfo(){
  modalMode='telegram';
  $('#modal').innerHTML=`
    <button class="close" onclick="closeModal()" aria-label="Close"><i class="ph ph-x" aria-hidden="true"></i></button>
    <div class="eyebrow"><i class="ph ph-paper-plane-tilt" aria-hidden="true"></i>Telegram daily brief</div>
    <h2>Today and tomorrow, every morning</h2>
    <p style="color:var(--muted);font-size:13px;line-height:1.6">HackCal sends a concise feed of events happening today and tomorrow at <b style="color:var(--txt)">7:30 AM Philippine time</b>. Multi-day events appear on every relevant day.</p>
    <div class="det-row"><span class="k">Schedule</span><span>Daily · 7:30 AM PHT</span></div>
    <div class="det-row"><span class="k">Commands</span><span><code>/feed</code> · <code>/today</code> · <code>/tomorrow</code> · <code>/id</code></span></div>

    <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Close</button><button class="btn primary" onclick="closeModal();openLive()"><i class="ph ph-globe-hemisphere-west" aria-hidden="true"></i>Review live sources</button></div>`;
  showModal();
}

function resetFilters(tagsOnly=false){
  activeTags.clear();
  if(!tagsOnly){
    q=''; fmtF=''; locF=''; srcF=''; upOnly=false; openOnly=false; nonStuOnly=false;
    $('#search').value='';
    $('#fmtFilter').value='';
    $('#locFilter').value='';
    $('#srcFilter').value='';
  }
  render();
}

/* ---- modal helpers ---- */
let modalMode='';   // 'detail' | 'form' | 'import' — gates swipe/arrow navigation
function showModal(){$('#modalBg').classList.add('show')}
function closeModal(){$('#modalBg').classList.remove('show'); modalMode='';}
$('#modalBg').onclick=e=>{if(e.target===$('#modalBg'))closeModal()};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();return}
  if(modalMode==='detail'){
    if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();navDetail(1)}
    else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();navDetail(-1)}
  }
});
// Swipe navigation on the detail modal: left/up → next, right/down → prev.
(function(){
  let x0=0,y0=0,t0=0;
  const m=$('#modal');
  m.addEventListener('touchstart',ev=>{const t=ev.changedTouches[0];x0=t.clientX;y0=t.clientY;t0=Date.now();},{passive:true});
  m.addEventListener('touchend',ev=>{
    if(modalMode!=='detail')return;
    const t=ev.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0, adx=Math.abs(dx), ady=Math.abs(dy);
    if(Date.now()-t0>700) return;                 // too slow to be a swipe
    if(Math.max(adx,ady)<45) return;              // too short
    if(adx>=ady) navDetail(dx<0?1:-1);            // horizontal
    else navDetail(dy<0?1:-1);                    // vertical
  },{passive:true});
})();

/* ---- wire up ---- */
$('#viewSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  setView(b.dataset.view);
});
$('#prevM').onclick=()=>{cur.setMonth(cur.getMonth()-1);renderMonth()};
$('#nextM').onclick=()=>{cur.setMonth(cur.getMonth()+1);renderMonth()};

$('#addBtn').onclick=()=>openForm(null);
$('#importBtn').onclick=openImport;
$('#lumaBtn').onclick=syncLuma;
$('#syncBtn').onclick=syncDiscord;
$('#themeBtn').onclick=()=>applyTheme(document.documentElement.getAttribute('data-theme')==='light'?'dark':'light');
$('#sideThemeBtn').onclick=()=>applyTheme(document.documentElement.getAttribute('data-theme')==='light'?'dark':'light');

$('#search').oninput=e=>{q=e.target.value;render()};

$('#locFilter').onchange=e=>{locF=e.target.value;render()};

$('#srcFilter').onchange=e=>{srcF=e.target.value;render()};
$('#upFilter').onclick=()=>{upOnly=!upOnly;render()};
$('#openFilter').onclick=()=>{openOnly=!openOnly;render()};
$('#nonStuFilter').onclick=()=>{nonStuOnly=!nonStuOnly;render()};
$('#clearFiltersBtn').onclick=()=>resetFilters();
$('#clearTagsBtn').onclick=()=>resetFilters(true);
$('#resetFiltersBtn').onclick=()=>resetFilters();
document.querySelectorAll('[data-side-view]').forEach(b=>b.onclick=()=>setView(b.dataset.sideView));
document.querySelectorAll('[data-nav-action]').forEach(b=>b.onclick=()=>{
  const action=b.dataset.navAction;
  if(action==='import')openImport();
  if(action==='luma')syncLuma();
  if(action==='discord')syncDiscord();
  if(action==='export')downloadFile('hackcal-all.ics',icsForEvents(filtered()));
});
document.querySelectorAll('[data-support]').forEach(b=>b.onclick=()=>{
  if(b.dataset.support==='settings')openLive();
  if(b.dataset.support==='feedback')toast('Feedback: email team@hackcal.dev');
  if(b.dataset.support==='help')openTelegramInfo();
});
$('#weekHint').onclick=()=>{setView('list');toast('Week-focused planning is available in the chronological List view.')};

const toolsBtn=$('#toolsBtn'), toolsMenu=$('#toolsMenu');
toolsBtn.onclick=e=>{e.stopPropagation();const show=!toolsMenu.classList.contains('show');toolsMenu.classList.toggle('show',show);toolsBtn.setAttribute('aria-expanded',show)};
toolsMenu.onclick=e=>e.stopPropagation();
toolsMenu.querySelectorAll('[data-tool]').forEach(btn=>btn.onclick=()=>{
  const action=btn.dataset.tool;
  toolsMenu.classList.remove('show'); toolsBtn.setAttribute('aria-expanded','false');
  if(action==='live')openLive();
  if(action==='import')openImport();
  if(action==='luma')syncLuma();
  if(action==='discord')syncDiscord();
  if(action==='export')downloadFile('hackcal-all.ics',icsForEvents(filtered()));
  if(action==='reset')resetFilters();
});
document.addEventListener('click',()=>{toolsMenu.classList.remove('show');toolsBtn.setAttribute('aria-expanded','false')});

$('#ver').textContent='v3 · '+data.length+' events';

applyTheme(localStorage.getItem('hackcal.theme') || 'light');
render();

/* Kick off live sync: fetch once on load, then keep it fresh on the chosen interval. */
startAutoSync();
liveSync(true);
</script>
